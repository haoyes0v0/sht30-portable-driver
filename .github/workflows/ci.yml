name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install static-analysis tool
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Configure
        run: cmake -S . -B build -DSHT30_BUILD_TESTS=ON -DSHT30_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Static analysis
        run: cppcheck --enable=warning,performance,portability --error-exitcode=1 --std=c99 --suppress=missingIncludeSystem -Iinclude -Itests src tests/mock_i2c.c tests/test_sht30.c

  cortex-m3-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Configure Cortex-M3 build
        run: >-
          cmake -S . -B build-arm
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          -DSHT30_BUILD_TESTS=OFF
          -DSHT30_BUILD_STM32_PORT=ON
          -DSHT30_BUILD_STM32_EXAMPLE=ON
          -DSTM32_HAL_INCLUDE_DIR=tests/stm32_hal_stub
      - name: Cross-compile core, adapter, and example
        run: cmake --build build-arm --parallel
